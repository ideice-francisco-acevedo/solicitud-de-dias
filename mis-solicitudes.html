<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Solicitudes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/panel.css">
</head>
<body>
    <div class="container">
        <header class="form-header">
            <h1>Mis Solicitudes de Días</h1>
        </header>

        <div class="panel-nav">
            <a href="index.html" class="btn btn-secondary btn-sm">Nueva Solicitud</a>
            <span id="badgeNotificaciones" class="badge hidden">0</span>
        </div>

        <div class="panel-content">
            <div class="form-row panel-filtro">
                <div class="form-group">
                    <label for="cedulaFiltro">Consultar por Cédula:</label>
                    <div class="input-with-button">
                        <input type="text" id="cedulaFiltro" placeholder="Ej: 001-1234567-8">
                        <button type="button" id="btnConsultar" class="btn btn-primary">Consultar</button>
                    </div>
                </div>
            </div>

            <div id="tablaContainer" class="tabla-container hidden">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha Solicitud</th>
                            <th>Empleado</th>
                            <th>Día Solicitado</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th>Observaciones</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes"></tbody>
                </table>
                <p id="sinResultados" class="sin-resultados hidden">No se encontraron solicitudes.</p>
            </div>

            <details class="notificaciones-section">
                <summary>Notificaciones <span id="badgeNotifDetalle" class="badge-inline hidden">0</span></summary>
                <ul id="listaNotificaciones" class="notif-lista"></ul>
            </details>
        </div>
    </div>

    <div id="spinner" class="spinner-overlay hidden">
        <div class="spinner"></div>
    </div>

    <div id="modalEditar" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>Editar Solicitud</h3>
            <form id="formEditar" novalidate onsubmit="return false">
                <input type="hidden" id="editSolicitudId">
                <div class="form-row">
                    <div class="form-group"><label for="editFechaSolicitud">Fecha solicitud:</label><input type="date" id="editFechaSolicitud"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="editObservaciones">Observaciones:</label><textarea id="editObservaciones" rows="2"></textarea></div>
                </div>
                <div class="form-actions">
                    <button type="button" id="btnGuardarEdicion" class="btn btn-success">Guardar</button>
                    <button type="button" id="btnCancelarEdicion" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/mis-solicitudes.js"></script>
</body>
</html>
